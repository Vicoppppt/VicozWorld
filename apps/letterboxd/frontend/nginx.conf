server {
    listen 80;
    server_name localhost;
    underscores_in_headers on;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy requests starting with /api/ to Python FastAPI backend container
    location /api/ {
        proxy_pass http://letterboxd-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward mTLS client certificate headers from reverse-proxy
        proxy_set_header X-Client-Cert-Status $http_x_client_cert_status;
        proxy_set_header X-Client-Cert-DN $http_x_client_cert_dn;
        proxy_set_header X-Client-Cert-CN $http_x_client_cert_cn;
        proxy_set_header X-Client-Cert-Serial $http_x_client_cert_serial;
    }
}
