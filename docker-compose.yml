services:
  # 🎬 VicozWorld Hub & Applications - Frontend (React 19 + Vite)
  letterboxd-frontend:
    image: vicozworld/letterboxd-frontend:latest
    build:
      context: ./apps/letterboxd/frontend
      dockerfile: Dockerfile
      args:
        - VITE_TMDB_API_KEY=${VITE_TMDB_API_KEY}
    container_name: letterboxd-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      letterboxd-backend:
        condition: service_healthy
    environment:
      - TZ=Europe/Paris
      - VITE_TMDB_API_KEY=${VITE_TMDB_API_KEY}
    networks:
      - app-network

  # ⚙️ Mon Letterboxd - Backend (FastAPI + SQLite + Woob)
  letterboxd-backend:
    image: vicozworld/letterboxd-backend:latest
    build:
      context: ./apps/letterboxd/backend
      dockerfile: Dockerfile
    container_name: letterboxd-backend
    restart: unless-stopped
    ports:
      # 🔒 Sécurité : accès local uniquement via le reverse proxy (NPM)
      # Le backend ne doit jamais être exposé directement sur Internet
      - "127.0.0.1:8000:8000"
    environment:
      - DATA_DIR=/app/data
      - TZ=Europe/Paris
      - TMDB_API_KEY=${TMDB_API_KEY:-${VITE_TMDB_API_KEY}}
      - VITE_TMDB_API_KEY=${VITE_TMDB_API_KEY:-${TMDB_API_KEY}}
      - GMAIL_EMAIL=${GMAIL_EMAIL:-}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD:-}
      - ENEDIS_PDL=${ENEDIS_PDL:-}
      - ENEDIS_TOKEN=${ENEDIS_TOKEN:-}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://vw.vicopetit.dedyn.io}
      - HASS_URL=${HASS_URL:-}
      - HASS_TOKEN=${HASS_TOKEN:-}
      - HASS_PLUG_ENTITY_ID=${HASS_PLUG_ENTITY_ID:-switch.prise_serveur}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./data/letterboxd:/app/data
      - ./data/certs:/app/data/certs
      - ./data/letterboxd/woob-config:/home/vicoz/.config/woob
      - ./data/letterboxd/woob-data:/home/vicoz/.local/share/woob
      - /sys/class/power_supply:/sys/class/power_supply:ro
    networks:
      app-network:
        aliases:
          - backend
          - letterboxd-backend

  # 📧 Gmail Assistant IA (Streamlit + Gemini IA)
  gmail-assistant:
    image: vicozworld/gmail-assistant:latest
    build:
      context: ./apps/gmail-assistant
      dockerfile: Dockerfile
    container_name: gmail-assistant
    restart: unless-stopped
    ports:
      # 🔒 Sécurité : Streamlit exposé en local uniquement — accès via NPM + mTLS ou IP locale
      - "127.0.0.1:8501:8501"
    environment:
      - DATA_DIR=/app/data
      - TZ=Europe/Paris
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GMAIL_EMAIL=${GMAIL_EMAIL:-}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD:-}
    volumes:
      - ./data/gmail:/app/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: letterboxd-frontend
  author: Victor
  category: Personal
  description:
    en_us: "VicozWorld Hub & Applications"
    fr_fr: "VicozWorld Portail & Applications"
  developer: Victor
  icon: "https://raw.githubusercontent.com/Vicoppppt/VicozWorld/main/apps/letterboxd/frontend/public/logo-icon.png"
  screenshot_link: []
  tagline:
    en_us: "Personal Dashboard & Web Apps"
    fr_fr: "Tableau de bord et applications personnelles"
  title:
    en_us: "VicozWorld"
    fr_fr: "VicozWorld"
  index: /
  host: vw.vicopetit.dedyn.io
  port_map: "443"
  scheme: https
