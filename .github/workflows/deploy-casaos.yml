name: Deploy to CasaOS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    name: Auto-deploy on CasaOS
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          # Stop old containers if running
          docker stop letterboxd-frontend letterboxd-backend mon-hub-outils gmail-assistant || true
          docker rm letterboxd-frontend letterboxd-backend mon-hub-outils gmail-assistant || true
          
          # Build and launch all services
          docker compose up -d --build --remove-orphans